<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0; url=game/">
<script>window.location.replace("game/");</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Jezero Ground Truth Explorer</title>
<style>
  :root{
    --bg:#0e0a08; --panel:rgba(18,13,10,0.86); --line:rgba(224,114,63,0.35);
    --text:#e8d2b8; --accent:#e0723f; --good:#5ec27a; --warn:#e05a4f; --muted:#a8937c;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:12px}
  #view{position:fixed;inset:0;touch-action:none}
  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;z-index:5}
  #hud{top:calc(8px + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px));max-width:min(360px,calc(58vw - 12px));line-height:1.45}
  #hud b{color:var(--accent)}
  #prov{top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));text-align:right;line-height:1.45;max-width:calc(42vw - 12px)}
  .m{color:var(--good)} .s{color:var(--warn)} .n{color:var(--muted)}
  #reticle{position:fixed;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border:1.5px solid rgba(255,255,255,0.75);border-radius:50%;z-index:4;pointer-events:none}
  #toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:9;display:none;max-width:86vw;text-align:center}
  #controls{bottom:calc(8px + env(safe-area-inset-bottom,0px));left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:6px}
  button{font-family:var(--mono);font-size:12px;color:var(--text);background:rgba(255,255,255,0.06);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:44px;min-height:40px}
  button.on{background:rgba(224,114,63,0.28);border-color:var(--accent)}
  #pad{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(118px + env(safe-area-inset-bottom,0px));z-index:6;display:grid;grid-template-columns:repeat(3,48px);gap:4px}
  #pad button{min-height:48px}
  #scores{top:auto;bottom:118px;left:8px;max-width:min(380px,calc(100vw - 190px));display:none;line-height:1.5}
  #scores table{border-collapse:collapse} #scores td{padding:1px 6px 1px 0}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:var(--bg);color:var(--accent);font-size:14px}
  label{display:flex;gap:6px;align-items:center}
  input[type=range]{width:90px}
  select{font-family:var(--mono);font-size:12px;color:var(--text);background:rgba(255,255,255,0.06);border:1px solid var(--line);border-radius:6px;min-height:40px;padding:0 6px}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (max-width:520px){ #prov{font-size:11px} #hud{font-size:11px} }
</style>
</head>
<body>
<div id="loading">Loading Jezero data…</div>
<canvas id="view"></canvas>
<div id="reticle"></div>
<div id="hud" class="panel"><b>JEZERO · Octavia E. Butler landing area</b><div id="hudtxt"></div></div>
<div id="prov" class="panel"><div id="provtxt"></div></div>
<div id="scores" class="panel"></div>
<div id="toast" class="panel"></div>
<div id="pad">
  <span></span><button data-k="f">▲</button><span></span>
  <button data-k="l">◀</button><button data-k="b">▼</button><button data-k="r">▶</button>
</div>
<div id="controls" class="panel">
  <button id="bCam">Chase</button>
  <button id="bProv">Provenance</button>
  <select id="tagLabel" aria-label="Feature to tag"><option>boulder</option><option>ripple</option><option>outcrop</option><option>sand patch</option><option>rover track</option></select>
  <button id="bTag">Tag</button>
  <button id="bGyro">Gyro</button>
  <button id="bScores">Scores</button>
  <label>Dust τ <input id="tau" type="range" min="0.3" max="4" step="0.1" value="0.6"></label>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="app.js"></script>
</body>
</html>
